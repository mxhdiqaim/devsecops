version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: devsecops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devsecops
      POSTGRES_PASSWORD: devsecops
      POSTGRES_DB: devsecops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devsecops"]
      interval: 5s
      timeout: 5s
      retries: 10

  target-api:
    build:
      context: .
      dockerfile: apps/target-api/Dockerfile
    container_name: devsecops-target-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://devsecops:devsecops@postgres:5432/devsecops
      PORT: "4000"
      NODE_ENV: production
    ports:
      - "4000:4000"

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: devsecops-dashboard
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://devsecops:devsecops@postgres:5432/devsecops
      PORT: "3000"
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
